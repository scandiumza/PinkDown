[package]
name = "pinkdown"
version = "1.8.12"
edition = "2021"
authors = ["PinkDown"]
description = "A polished, native Markdown reader and editor in Rust."
license = "MIT"

[dependencies]
chardetng = "0.1"
encoding_rs = "0.8"
eframe = { version = "0.32", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }
egui_commonmark = { path = "vendor/egui_commonmark", default-features = false, features = ["pulldown_cmark"] }
image = { version = "0.25.9", default-features = false, features = ["png"] }
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
rfd = "0.15"
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
ureq = { version = "2.12", features = ["json"] }

[build-dependencies]
winres = "0.1"

[dev-dependencies]
# Both already in the dependency graph via egui; used to verify the font
# byte patching against the real embedded fonts.
ab_glyph = "0.2"
epaint_default_fonts = "0.32"

[target.'cfg(windows)'.dependencies]
raw-window-handle = "0.6"
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.5.2"
objc2-app-kit = { version = "0.2.2", features = ["NSApplication", "NSResponder"] }
objc2-foundation = { version = "0.2.2", features = ["NSArray", "NSObject", "NSString", "NSURL"] }
winit = { version = "0.30.13", default-features = false }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
