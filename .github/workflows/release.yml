name: Build binaries

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: true
      max-parallel: 3
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: pinkdown-windows-x64-setup.exe
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: pinkdown-macos-arm64.dmg
          - os: macos-15-intel
            target: x86_64-apple-darwin
            artifact: pinkdown-macos-x64.dmg
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: pinkdown-linux-x86_64.tar.gz
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            artifact: pinkdown-linux-aarch64.tar.gz
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}
      - run: cargo build --release --target ${{ matrix.target }}
      - name: Build Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          $metadata = cargo metadata --format-version 1 --no-deps | ConvertFrom-Json
          $version = ($metadata.packages | Where-Object name -eq 'pinkdown').version
          $source = (Resolve-Path "target/${{ matrix.target }}/release/pinkdown.exe").Path
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          & $iscc "/DMyAppVersion=$version" "/DMyAppExeSource=$source" installer\pinkdown.iss
          if (!(Test-Path 'dist\pinkdown-windows-x64-setup.exe')) {
            throw 'Inno Setup did not create the expected Windows installer'
          }
      - name: Package macOS DMG
        if: runner.os == 'macOS'
        shell: pwsh
        run: |
          $metadata = cargo metadata --format-version 1 --no-deps | ConvertFrom-Json
          $version = ($metadata.packages | Where-Object name -eq 'pinkdown').version
          ./installer/macos/package.ps1 `
            -Binary "target/${{ matrix.target }}/release/pinkdown" `
            -ArtifactName "${{ matrix.artifact }}" `
            -Version $version
      - name: Package Linux tarball
        if: runner.os == 'Linux'
        shell: bash
        run: |
          staging=$(mktemp -d)
          cp "target/${{ matrix.target }}/release/pinkdown" "$staging/"
          cp installer/linux/install.sh installer/linux/pinkdown.desktop LICENSE "$staging/"
          cp assets/pinkdown-linux-icon.png "$staging/"
          chmod 755 "$staging/pinkdown" "$staging/install.sh"
          mkdir -p dist
          tar -czf "dist/${{ matrix.artifact }}" -C "$staging" .
          echo "Packaged ${{ matrix.artifact }}:"
          tar -tzf "dist/${{ matrix.artifact }}"
      - uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}

  publish-release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v7
        with:
          path: dist
          merge-multiple: true
      - name: Create checksums
        run: |
          for asset in dist/*; do
            sha256sum "$asset" > "$asset.sha256"
          done
      - name: Generate release notes
        run: |
          python3 .github/scripts/release-notes.py \
            "${{ github.ref_name }}" \
            "${{ github.repository }}" \
            > release-notes.md
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "${{ github.ref_name }}" > /dev/null 2>&1; then
            gh release upload "${{ github.ref_name }}" dist/* --clobber
          else
            gh release create "${{ github.ref_name }}" \
              --notes-file release-notes.md \
              --verify-tag \
              dist/*
          fi
